# nlt-app — app-only gateway
# World Engine Durable Object was archived to archive/pre-1-20-fullstack-2026-09-03/src/index.ts
# via `git mv` (2026-09-03). Canonical Worker is now in:
#   https://github.com/NeuroLift-Technologies/nlt-world-engine
# This wrangler.toml is retained for reference only — do not deploy WorldEngineDO from nlt-app.
# App gateway is `apps/api` (FastAPI) and `apps/web`/`apps/mobile` surfaces that call upstream via A2A.

name = "world-engine"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "WORLD_ENGINE", class_name = "WorldEngineDO" }
]

# The World Engine Durable Object class must be registered via a migration.
# Workers Builds deploys with `wrangler versions upload`, which cannot apply the
# initial migration — it must be bootstrapped once with a non-versioned
# `wrangler deploy` (code 10211). Keep this block present afterwards so the
# class stays registered for subsequent versioned uploads.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldEngineDO"]
