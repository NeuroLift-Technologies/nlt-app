name: Governance Validation

# Validates the .github-private governance structure on every push and PR.
# Governed by: ORG-DEV-OTOI-1.0.3
#
# ── Fork Repository Policy ────────────────────────────────────────────────────
# Workflows triggered by pull requests from forked repositories are governed by
# org-level settings (Settings → Actions → Fork pull request workflows).
# Per org policy, fork PR workflows can only be approved and run by
# Joshua W. Dorsey, Sr. before this check executes against any fork PR.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run governance validation
        run: bash .nltotoi/scripts/validate-governance.sh
